name: Sync Android releases from Pgyer

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-pgyer-android-releases
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'wdachao/wdachao.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OSS SDK
        run: python -m pip install --disable-pip-version-check oss2==2.19.1
      - name: Query Pgyer and publish changed Android channels
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: python tool/sync_android_releases.py
